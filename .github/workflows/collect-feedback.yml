name: Weekly Feedback Sweep

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: corepack enable

      - name: Clone Engagement Harness
        run: |
          git clone https://github.com/${{ github.repository_owner }}/harness-review.git /tmp/harness

      - name: Build
        run: |
          cd /tmp/harness
          pnpm install
          pnpm build

      - name: Link CLI
        run: |
          cd /tmp/harness/packages/cli
          pnpm link --global

      - name: Weekly collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          engagement-harness feedback collect \
            --repo ${{ github.repository }} \
            --days 7

      - name: Commit metrics
        run: |
          git config user.name "Engagement Harness Bot"
          git config user.email "engagement-harness[bot]@users.noreply.github.com"
          git add .engagement-harness/feedback/metrics.json
          git diff --cached --quiet || git commit -m "chore: weekly feedback update"
          git push origin HEAD:main
